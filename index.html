  <style>
    * {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f8b3cfff;
  color: #222;
  font-family: "Helvetica Neue", Arial, sans-serif;
}

#all-contents {
  max-width: 1500px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 32px 40px;
}
main {
display: grid;
grid-template-columns: minmax(220px, 1fr) minmax(420px, 1.6fr);
align-items: center;
min-height: calc(100vh - 160px);
gap: clamp(32px, 5vw, 80px);
}
.sidebar {
width: 100%;
}
.content {
display: flex;
flex-direction: column;
align-items: flex-start;
gap: 12px;
}
h2 {
margin: 0;
font-size: clamp(4rem, 10vw, 7rem);
line-height: 0.9;
font-weight: 900;
letter-spacing: -0.04em;
text-transform: uppercase;
color: #000;
}
.content > p {
margin: 0;
color: #ff4394ff;
font-size: 0.9rem;
text-transform: uppercase;
letter-spacing: 0.15em;
line-height: 1.4;
}
#interests {
margin-top: 32px;
width: 100%;
}
#interests h3 {
margin: 0 0 12px;
font-size: 0.75rem;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.2em;
color: #ff0080ff;
}
#interests ul {
list-style: none;
margin: 0;
padding: 0;
display: flex;
flex-wrap: wrap;
gap: 8px;
}
#interests li {
color: #ff0080ff;
font-size: 1rem;
font-weight: 600;
padding: 10px 20px;
background: #000000ff;
border: 1px solid #000000ff;
border-radius: 100px;
transition:
background 0.25s ease,
color 0.25s ease,
transform 0.25s ease;
cursor: default;
}
#interests li:hover {
background: #ff0073ff;
color: #ffb6dfff;
border-color: #000;
transform: translateY(-2px);
}
  </style>

  
</head>
